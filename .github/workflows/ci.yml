name: Realtek RTL8852BE macOS Driver CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos-build:
    name: macOS Build & Test (Kext, App, CLI, DMG)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -r
          xcodebuild -version

      - name: Run portable production regressions and legacy simulator
        run: make test CXX=clang++

      - name: Build SwiftUI app and run production app model regressions
        run: make app test-app

      - name: Build RTL8852BEWiFi Kernel Extension (Kext)
        run: |
          make kext
          codesign --verify --strict build/RTL8852BEWiFi.kext
          kmutil print-diagnostics --bundle-path build/RTL8852BEWiFi.kext

      - name: Build Command Line Utility (rtl8852be_cli)
        run: |
          make cli

      - name: Build Distributable DMG Installer
        run: |
          chmod +x scripts/*.sh installer/scripts/* 2>/dev/null || true
          ./scripts/build_dmg.sh

      - name: Upload Kext and Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RTL8852BE-macOS-WiFi-Bundle
          path: |
            build/RTL8852BEWiFi.kext
            tools/rtl8852be_cli
            build/RTL8852BE Wireless Utility.app
            dist/*.dmg

  linux-sanitizers:
    name: Linux ASan/UBSan Contract & Mock Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Clang & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make build-essential

      - name: Run portable production regressions and legacy simulator
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make test CXX=clang++

  windows-build:
    name: Windows MSVC Portable Regressions & Legacy Simulator
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run MSVC Test Suite
        shell: cmd
        run: |
          tools\build_test.bat
