name: Realtek RTL8852BE macOS Driver CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos-build:
    name: macOS Build & Test (Kext, App, CLI, DMG)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -r
          xcodebuild -version

      - name: Verify Hardware Contract & Memory Safety (ASan/UBSan)
        run: |
          make test-hardware

      - name: Verify RFC 3394 Crypto & CCMP Bounds (ASan/UBSan)
        run: |
          make test-crypto

      - name: Run Full 57-Test Mock Hardware Suite
        run: |
          make test

      - name: Build RTL8852BEWiFi Kernel Extension (Kext)
        run: |
          make kext
          kmutil print-diagnostics --bundle-path build/RTL8852BEWiFi.kext || true

      - name: Build Command Line Utility (rtl8852be_cli)
        run: |
          make cli

      - name: Build Native SwiftUI GUI Utility App
        run: |
          mkdir -p "build/RTL8852BE Wireless Utility.app/Contents/MacOS"
          mkdir -p "build/RTL8852BE Wireless Utility.app/Contents/Resources"
          cp gui/Info.plist "build/RTL8852BE Wireless Utility.app/Contents/Info.plist"
          if [ -f gui/AppIcon.icns ]; then
            cp gui/AppIcon.icns "build/RTL8852BE Wireless Utility.app/Contents/Resources/AppIcon.icns"
          fi
          swiftc -target x86_64-apple-macos14.0 -O \
            -import-objc-header gui/RTL8852BEBridge.h \
            gui/Sources/App.swift \
            gui/Sources/AppModel.swift \
            gui/Sources/DesignSystem.swift \
            gui/Sources/Vendor.swift \
            gui/Sources/Views/*.swift \
            -o "build/RTL8852BE Wireless Utility.app/Contents/MacOS/RTL8852BEWirelessUtility"

      - name: Build Distributable DMG Installer
        run: |
          ./scripts/build_dmg.sh

      - name: Upload Kext and Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RTL8852BE-macOS-WiFi-Bundle
          path: |
            build/RTL8852BEWiFi.kext
            tools/rtl8852be_cli
            build/RTL8852BE Wireless Utility.app
            dist/*.dmg

  linux-sanitizers:
    name: Linux ASan/UBSan Contract & Mock Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Clang & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make build-essential

      - name: Run Hardware Contract (Clang ASan/UBSan)
        run: |
          clang++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -Isrc tests/test_hardware_contract.cpp src/RTL8852BE_tables.cpp src/RTL8852BE_firmware.cpp -o build_hw_contract
          ./build_hw_contract

      - name: Run Crypto Verification (Clang ASan/UBSan)
        run: |
          clang++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -Isrc tests/test_crypto_bounds.cpp src/RTL8852BE_crypto.cpp -o build_crypto_bounds
          ./build_crypto_bounds

      - name: Run Full Mock Test Suite (57 Tests)
        run: |
          make -C tests test

  windows-build:
    name: Windows MSVC Contract & Mock Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run MSVC Test Suite
        shell: cmd
        run: |
          tools\build_test.bat
